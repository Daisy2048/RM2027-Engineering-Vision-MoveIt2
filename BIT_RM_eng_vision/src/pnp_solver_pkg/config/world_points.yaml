# 世界坐标系下的目标 3D 点（单位 mm），标准右手系。
# 原点为兑换柱（exchange）末端中心；key 命名对应实物特征位置，
# keypoint_mapping.py 将检测关键点名映射到这些 key。
#
# 尺寸变更时只需改本文件，无需改代码。
world_points:
  # pillar 四个角点
  brb: [99.9, -39.35, -39.35]
  brt: [99.9, -39.35, 39.35]
  blb: [99.9, 39.35, -39.35]
  blt: [99.9, 39.35, 39.35]

  # exchange 中部灯条
  mrt: [114.0, -114.2, 171.7]
  mrb: [114.0, -114.2, 39.9]
  mlt: [114.0, 114.2, 171.7]
  mlb: [114.0, 114.2, 39.9]

  # exchange 顶部结构
  tl: [114.0, 84.3, 280.9]
  tm: [114.0, 0.0, 339.55]
  tr: [114.0, -84.33, 280.9]
